<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertex Engineering Consultancy — Site Upgrade in Progress</title>
<meta name="description" content="Vertex Engineering Consultancy's website is currently undergoing a technical upgrade. We'll be back online shortly.">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="noise-layer" aria-hidden="true"></div>
  <div class="beam-layer" aria-hidden="true"></div>

  <main class="stage">

    <div class="mark">
      <img src="assets/vertex-logo.png" alt="Vertex Engineering Consultancy" class="mark-logo">
    </div>

    <div class="loader" role="status" aria-label="Loading">
      <div class="loader-track">
        <div class="loader-fill" id="loaderFill"></div>

      <span class="loader-pct" id="loaderPct">00%</span>

    <h1 class="headline" id="headline" aria-label="We're upgrading your experience">
      <span class="line" data-final="WE'RE UPGRADING">WE'RE UPGRADING</span>
      <span class="line" data-final="YOUR EXPERIENCE">YOUR EXPERIENCE</span>

    <p class="subtext" id="subtext">
      Our website is undergoing a technical upgrade to serve you better.
      In the meantime, take a look at what we do.
    </p>

    <a href="Vertex-Engineering-Consultancy-Company-Profile.pdf"
       target="_blank"
       rel="noopener noreferrer"
       class="cta"
       id="cta">
      <span class="cta-label">View Company Profile</span>
      <svg class="cta-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8H13M13 8L8.5 3.5M13 8L8.5 12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <div class="footer-line" id="footerLine">
      <span>VERTEX ENGINEERING CONSULTANCY</span>
      <span class="dot">&middot;</span>
      <span>RIYADH, SAUDI ARABIA</span>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
